<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Λέξεις</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Λέξεις">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2b3a">
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#425366;
    --paper:#f6f1e7;
    --paper-dim:#ece4d3;
    --aegean:#2f6690;
    --aegean-deep:#1e4a6b;
    --gold:#c9973d;
    --olive:#5b6b43;
    --clay:#a8583c;
    --line:rgba(28,43,58,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--ink) 0%, #16222f 100%);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 18px 24px;
  }

  /* header */
  header{padding-bottom:10px;}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;}
  h1{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.02em;
    color:var(--paper);
  }
  h1 .accent{color:var(--gold);font-style:italic;font-weight:500;}
  .stats{
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--paper-dim);
    opacity:0.7;
  }

  /* meander divider — signature element */
  .meander{
    width:100%;
    height:14px;
    margin:12px 0 18px;
    opacity:0.55;
  }

  .progress-track{
    height:5px;
    border-radius:3px;
    background:rgba(246,241,231,0.12);
    overflow:hidden;
    margin-bottom:4px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),#e0b563);
    border-radius:3px;
    transition:width 0.4s ease;
    width:0%;
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:var(--paper-dim);
    opacity:0.6;
    margin-bottom:18px;
  }

  /* card */
  .card-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:340px;
  }
  .scene{
    perspective:1400px;
    width:100%;
    height:320px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:18px;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:26px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.04) inset;
    border:1px solid rgba(0,0,0,0.06);
  }
  .face.back{transform:rotateY(180deg);}
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.55;
    margin-bottom:14px;
  }
  .english{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:38px;
    text-align:center;
    line-height:1.15;
  }
  .tap-hint{
    position:absolute;
    bottom:16px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.4;
    letter-spacing:0.05em;
  }
  .greek-primary-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .greek-primary{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:700;
    font-size:34px;
    color:var(--aegean-deep);
    text-align:center;
  }
  .speak-btn{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(47,102,144,0.1);
    border:1px solid rgba(47,102,144,0.25);
    color:var(--aegean-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .speak-btn:active{
    transform:scale(0.9);
    background:rgba(47,102,144,0.2);
  }
  .speak-btn.speaking{
    background:rgba(201,151,61,0.25);
    border-color:rgba(201,151,61,0.5);
    color:var(--gold);
  }
  .conj-table{
    width:100%;
    border-top:1px solid var(--line);
    padding-top:10px;
    display:grid;
    grid-template-columns:auto 1fr;
    row-gap:4px;
    column-gap:14px;
    font-size:14px;
  }
  .conj-table .pron{
    color:var(--ink-soft);
    opacity:0.6;
    font-size:12px;
    text-align:right;
    padding-top:2px;
  }
  .conj-table .form{
    font-family:Georgia,'Times New Roman',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
  }
  .conj-table .form.primary{color:var(--aegean-deep);}

  /* controls */
  .controls{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn{
    flex:1;
    padding:15px 8px;
    border-radius:13px;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.3;cursor:default;}
  .btn:disabled:active{transform:none;}
  .btn-learning{
    background:rgba(168,88,60,0.18);
    color:#e2977f;
    border:1px solid rgba(168,88,60,0.35);
  }
  .btn-known{
    background:rgba(91,107,67,0.28);
    color:#b9caa0;
    border:1px solid rgba(91,107,67,0.5);
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    font-size:11.5px;
  }
  .link-btn{
    background:none;
    color:var(--paper-dim);
    opacity:0.55;
    padding:6px 4px;
    letter-spacing:0.02em;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .link-btn:active{opacity:0.9;}

  .deck-tabs{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .deck-tab{
    flex:1;
    padding:9px 6px;
    border-radius:10px;
    background:rgba(246,241,231,0.06);
    border:1px solid rgba(246,241,231,0.12);
    color:var(--paper-dim);
    font-size:13px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .deck-tab.active{
    background:rgba(201,151,61,0.18);
    border-color:rgba(201,151,61,0.45);
    color:var(--gold);
  }
  .deck-tab:active{transform:scale(0.97);}

  .article{
    color:var(--gold);
    font-style:italic;
    font-weight:600;
    margin-right:8px;
  }
  .noun-note{
    width:100%;
    border-top:1px solid var(--line);
    padding-top:10px;
    font-size:12.5px;
    color:var(--ink-soft);
    opacity:0.6;
    text-align:center;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    border:1px solid rgba(246,241,231,0.15);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:10;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>Λέξεις <span class="accent" id="deckAccent">verbs</span></h1>
      <div class="stats" id="statsLabel">— / —</div>
    </div>
    <div class="deck-tabs">
      <button class="deck-tab" id="tabVerbs" data-deck="verbs">Ρήματα · Verbs</button>
      <button class="deck-tab" id="tabNouns" data-deck="nouns">Ουσιαστικά · Nouns</button>
    </div>
  </header>

  <svg class="meander" viewBox="0 0 400 14" preserveAspectRatio="none">
    <path d="M0,2 H14 V12 H26 V2 H40 V12 H52 V2 H66 V12 H78 V2 H92 V12 H104 V2 H118 V12 H130 V2 H144 V12 H156 V2 H170 V12 H182 V2 H196 V12 H208 V2 H222 V12 H234 V2 H248 V12 H260 V2 H274 V12 H286 V2 H300 V12 H312 V2 H326 V12 H338 V2 H352 V12 H364 V2 H378 V12 H390 V2 H400"
      fill="none" stroke="#c9973d" stroke-width="2"/>
  </svg>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-labels">
    <span id="masteredLabel">0 mastered</span>
    <span id="learningLabel">0 still learning</span>
  </div>

  <div class="card-zone">
    <div class="scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow" id="frontEyebrow">verb</div>
          <div class="english" id="englishText">—</div>
          <div class="tap-hint">tap to reveal</div>
        </div>
        <div class="face back">
          <div class="greek-primary-row">
            <div class="greek-primary" id="greekPrimary">—</div>
            <button class="speak-btn" id="speakBtn" aria-label="Play pronunciation" title="Play pronunciation">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"></polygon>
                <path d="M16 8a5 5 0 0 1 0 8"></path>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
              </svg>
            </button>
          </div>
          <div class="conj-table" id="conjTable"></div>
          <div class="noun-note" id="nounNote"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-learning" id="btnLearning" disabled>Still learning</button>
    <button class="btn btn-known" id="btnKnown" disabled>Got it</button>
  </div>

  <div class="footer-row">
    <button class="link-btn" id="shuffleBtn">reshuffle deck</button>
    <button class="link-btn" id="resetBtn">reset progress</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const VERBS = [
  {en:"be", gr:["είμαι","είσαι","είναι","είμαστε","είσαστε / είστε","είναι"]},

  {en:"office", article:"το", gr:"γραφείο"},
  {en:"shop", article:"το", gr:"μαγαζί"},
  {en:"restaurant", article:"το", gr:"εστιατόριο"},
  {en:"hospital", article:"το", gr:"νοσοκομείο"},
  {en:"church", article:"η", gr:"εκκλησία"},
  {en:"sea", article:"η", gr:"θάλασσα"},
  {en:"mountain", article:"το", gr:"βουνό"},
  {en:"village", article:"το", gr:"χωριό"},
  {en:"square", article:"η", gr:"πλατεία"},
  {en:"airport", article:"το", gr:"αεροδρόμιο"},

  {en:"head", article:"το", gr:"κεφάλι"},
  {en:"hand / arm", article:"το", gr:"χέρι"},
  {en:"foot / leg", article:"το", gr:"πόδι"},
  {en:"eye", article:"το", gr:"μάτι"},
  {en:"mouth", article:"το", gr:"στόμα"},
  {en:"heart", article:"η", gr:"καρδιά"},
  {en:"ear", article:"το", gr:"αυτί"},
  {en:"face", article:"το", gr:"πρόσωπο"},
  {en:"nose", article:"η", gr:"μύτη"},
  {en:"tooth", article:"το", gr:"δόντι"},

  {en:"life", article:"η", gr:"ζωή"},
  {en:"world / people", article:"ο", gr:"κόσμος"},
  {en:"thing", article:"το", gr:"πράγμα"},
  {en:"idea", article:"η", gr:"ιδέα"},
  {en:"problem", article:"το", gr:"πρόβλημα"},
  {en:"money", article:"το", gr:"χρήμα"},
  {en:"love", article:"η", gr:"αγάπη"},
  {en:"hope", article:"η", gr:"ελπίδα"},
  {en:"truth", article:"η", gr:"αλήθεια"},
  {en:"dream", article:"το", gr:"όνειρο"},

  {en:"car", article:"το", gr:"αυτοκίνητο"},
  {en:"bus", article:"το", gr:"λεωφορείο"},
  {en:"train", article:"το", gr:"τρένο"},
  {en:"airplane", article:"το", gr:"αεροπλάνο"},
  {en:"trip / journey", article:"το", gr:"ταξίδι"},
  {en:"suitcase", article:"η", gr:"βαλίτσα"},
  {en:"ticket", article:"το", gr:"εισιτήριο"},
  {en:"bicycle", article:"το", gr:"ποδήλατο"},
  {en:"harbor / port", article:"το", gr:"λιμάνι"},
  {en:"map", article:"ο", gr:"χάρτης"}
];

const PRONOUNS = ["εγώ","εσύ","αυτός/ή/ό","εμείς","εσείς","αυτοί/ές/ά"];
const MASTER_BOX = 4;

const DECKS = {
  verbs: { label:"verbs", type:"verb", items:VERBS, storageKey:"greek-verb-progress-v1" },
  nouns: { label:"nouns", type:"noun", items:NOUNS, storageKey:"greek-noun-progress-v1" }
};
const ACTIVE_DECK_KEY = "greek-active-deck";

let activeDeckId = "verbs";
let progress = {};      // id -> box (0-4), scoped to the active deck
let queue = [];         // array of item ids for this session
let qPos = 0;
let currentId = null;
let flipped = false;

const cardEl = document.getElementById('card');
const englishText = document.getElementById('englishText');
const greekPrimary = document.getElementById('greekPrimary');
const conjTable = document.getElementById('conjTable');
const nounNote = document.getElementById('nounNote');
const btnLearning = document.getElementById('btnLearning');
const btnKnown = document.getElementById('btnKnown');
const statsLabel = document.getElementById('statsLabel');
const progressFill = document.getElementById('progressFill');
const masteredLabel = document.getElementById('masteredLabel');
const learningLabel = document.getElementById('learningLabel');
const toastEl = document.getElementById('toast');
const deckAccent = document.getElementById('deckAccent');
const tabVerbs = document.getElementById('tabVerbs');
const tabNouns = document.getElementById('tabNouns');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function currentDeck(){
  return DECKS[activeDeckId];
}

function buildQueue(){
  const deck = currentDeck();
  let ids = [];
  deck.items.forEach((v,i)=>{
    const box = progress[i] ?? 0;
    const weight = MASTER_BOX + 1 - box; // lower box = seen more often
    for(let k=0;k<weight;k++) ids.push(i);
  });
  queue = shuffle(ids);
  qPos = 0;
}

function loadProgress(){
  const deck = currentDeck();
  try{
    const raw = localStorage.getItem(deck.storageKey);
    progress = raw ? JSON.parse(raw) : {};
  }catch(e){
    progress = {};
  }
}

function saveProgress(){
  const deck = currentDeck();
  try{
    localStorage.setItem(deck.storageKey, JSON.stringify(progress));
  }catch(e){
    // storage unavailable — progress stays in-memory for this session
  }
}

function updateStats(){
  const deck = currentDeck();
  const total = deck.items.length;
  let mastered = 0, learning = 0;
  deck.items.forEach((v,i)=>{
    const box = progress[i] ?? 0;
    if(box >= MASTER_BOX) mastered++;
    else if(box === 0) learning++;
  });
  statsLabel.textContent = `${mastered} / ${total} mastered`;
  progressFill.style.width = `${Math.round((mastered/total)*100)}%`;
  masteredLabel.textContent = `${mastered} mastered`;
  learningLabel.textContent = `${learning} still learning`;
}

function updateTabsUI(){
  tabVerbs.classList.toggle('active', activeDeckId === 'verbs');
  tabNouns.classList.toggle('active', activeDeckId === 'nouns');
  deckAccent.textContent = currentDeck().label;
}

function switchDeck(id){
  if(id === activeDeckId) return;
  activeDeckId = id;
  try{ localStorage.setItem(ACTIVE_DECK_KEY, id); }catch(e){}
  updateTabsUI();
  loadProgress();
  updateStats();
  buildQueue();
  renderCard();
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1400);
}

function renderCard(){
  const deck = currentDeck();
  if(qPos >= queue.length){
    buildQueue();
    if(queue.length === 0) return;
  }
  currentId = queue[qPos];
  flipped = false;
  cardEl.classList.remove('flipped');
  btnLearning.disabled = true;
  btnKnown.disabled = true;

  const item = deck.items[currentId];
  const mastered = (progress[currentId] ?? 0) >= MASTER_BOX;
  englishText.textContent = item.en;
  document.getElementById('frontEyebrow').textContent =
    (deck.type === 'verb' ? 'verb' : 'noun') + (mastered ? ' · mastered' : '');

  if(deck.type === 'verb'){
    greekPrimary.textContent = item.gr[0];
    conjTable.style.display = 'grid';
    conjTable.innerHTML = '';
    PRONOUNS.forEach((p,idx)=>{
      const pronEl = document.createElement('div');
      pronEl.className = 'pron';
      pronEl.textContent = p;
      const formEl = document.createElement('div');
      formEl.className = 'form' + (idx===0 ? ' primary':'');
      formEl.textContent = item.gr[idx];
      conjTable.appendChild(pronEl);
      conjTable.appendChild(formEl);
    });
    nounNote.style.display = 'none';
    nounNote.textContent = '';
  } else {
    greekPrimary.innerHTML = `<span class="article">${item.article}</span>${item.gr}`;
    conjTable.style.display = 'none';
    conjTable.innerHTML = '';
    nounNote.style.display = 'block';
    nounNote.textContent = `gender: ${item.article === 'ο' ? 'masculine' : item.article === 'η' ? 'feminine' : 'neuter'}`;
  }
}

function flipCard(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
  if(flipped){
    btnLearning.disabled = false;
    btnKnown.disabled = false;
  }
}

function advance(known){
  const deck = currentDeck();
  const box = progress[currentId] ?? 0;
  progress[currentId] = known ? Math.min(box+1, MASTER_BOX) : 0;
  saveProgress();
  updateStats();
  if(known && progress[currentId] === MASTER_BOX && box < MASTER_BOX){
    showToast(`"${deck.items[currentId].en}" mastered ✦`);
  }
  qPos++;
  renderCard();
}

let greekVoice = null;
function pickGreekVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  greekVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('el')) || null;
}
if('speechSynthesis' in window){
  pickGreekVoice();
  window.speechSynthesis.onvoiceschanged = pickGreekVoice;
}

function speakCurrent(){
  if(!('speechSynthesis' in window)){
    showToast('Pronunciation not supported on this browser');
    return;
  }
  const deck = currentDeck();
  const item = deck.items[currentId];
  const text = deck.type === 'verb'
    ? item.gr[0].split(' / ')[0]
    : `${item.article} ${item.gr}`;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'el-GR';
  if(greekVoice) utter.voice = greekVoice;
  utter.rate = 0.85;
  const btn = document.getElementById('speakBtn');
  utter.onstart = () => btn.classList.add('speaking');
  utter.onend = () => btn.classList.remove('speaking');
  utter.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

document.getElementById('speakBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  speakCurrent();
});

cardEl.addEventListener('click', flipCard);
btnLearning.addEventListener('click', (e)=>{ e.stopPropagation(); advance(false); });
btnKnown.addEventListener('click', (e)=>{ e.stopPropagation(); advance(true); });

tabVerbs.addEventListener('click', () => switchDeck('verbs'));
tabNouns.addEventListener('click', () => switchDeck('nouns'));

document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  buildQueue();
  renderCard();
  showToast('Deck reshuffled');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  const deck = currentDeck();
  if(confirm(`Reset progress for ${deck.label}? This clears every card back to "still learning".`)){
    progress = {};
    saveProgress();
    updateStats();
    buildQueue();
    renderCard();
    showToast('Progress reset');
  }
});

document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){ e.preventDefault(); flipCard(); }
  if(e.code === 'ArrowLeft' && flipped) advance(false);
  if(e.code === 'ArrowRight' && flipped) advance(true);
});

(function init(){
  try{
    const saved = localStorage.getItem(ACTIVE_DECK_KEY);
    if(saved && DECKS[saved]) activeDeckId = saved;
  }catch(e){}
  updateTabsUI();
  loadProgress();
  updateStats();
  buildQueue();
  renderCard();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // offline caching unavailable — app still works online as normal
    });
  });
}
</script>
</body>
</html>
