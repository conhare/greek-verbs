<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Greek Verbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#425366;
    --paper:#f6f1e7;
    --paper-dim:#ece4d3;
    --aegean:#2f6690;
    --aegean-deep:#1e4a6b;
    --gold:#c9973d;
    --olive:#5b6b43;
    --clay:#a8583c;
    --line:rgba(28,43,58,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,var(--ink) 0%, #16222f 100%);
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    width:100%;
    max-width:440px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 18px 24px;
  }

  /* header */
  header{padding-bottom:10px;}
  .title-row{display:flex;align-items:baseline;justify-content:space-between;}
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.02em;
    color:var(--paper);
  }
  h1 .accent{color:var(--gold);font-style:italic;font-weight:500;}
  .stats{
    font-size:11.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--paper-dim);
    opacity:0.7;
  }

  /* meander divider — signature element */
  .meander{
    width:100%;
    height:14px;
    margin:12px 0 18px;
    opacity:0.55;
  }

  .progress-track{
    height:5px;
    border-radius:3px;
    background:rgba(246,241,231,0.12);
    overflow:hidden;
    margin-bottom:4px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold),#e0b563);
    border-radius:3px;
    transition:width 0.4s ease;
    width:0%;
  }
  .progress-labels{
    display:flex;
    justify-content:space-between;
    font-size:10.5px;
    color:var(--paper-dim);
    opacity:0.6;
    margin-bottom:18px;
  }

  /* card */
  .card-zone{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:340px;
  }
  .scene{
    perspective:1400px;
    width:100%;
    height:320px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped{transform:rotateY(180deg);}
  .face{
    position:absolute;
    inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border-radius:18px;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:26px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.04) inset;
    border:1px solid rgba(0,0,0,0.06);
  }
  .face.back{transform:rotateY(180deg);}
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0.55;
    margin-bottom:14px;
  }
  .english{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:38px;
    text-align:center;
    line-height:1.15;
  }
  .tap-hint{
    position:absolute;
    bottom:16px;
    font-size:11px;
    color:var(--ink-soft);
    opacity:0.4;
    letter-spacing:0.05em;
  }
  .greek-primary-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .greek-primary{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:34px;
    color:var(--aegean-deep);
    text-align:center;
  }
  .speak-btn{
    flex-shrink:0;
    width:36px;
    height:36px;
    border-radius:50%;
    background:rgba(47,102,144,0.1);
    border:1px solid rgba(47,102,144,0.25);
    color:var(--aegean-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .speak-btn:active{
    transform:scale(0.9);
    background:rgba(47,102,144,0.2);
  }
  .speak-btn.speaking{
    background:rgba(201,151,61,0.25);
    border-color:rgba(201,151,61,0.5);
    color:var(--gold);
  }
  .conj-table{
    width:100%;
    border-top:1px solid var(--line);
    padding-top:10px;
    display:grid;
    grid-template-columns:auto 1fr;
    row-gap:4px;
    column-gap:14px;
    font-size:14px;
  }
  .conj-table .pron{
    color:var(--ink-soft);
    opacity:0.6;
    font-size:12px;
    text-align:right;
    padding-top:2px;
  }
  .conj-table .form{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:17px;
    color:var(--ink);
  }
  .conj-table .form.primary{color:var(--aegean-deep);}

  /* controls */
  .controls{
    display:flex;
    gap:10px;
    margin-top:20px;
  }
  button{
    font-family:'Inter',sans-serif;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .btn{
    flex:1;
    padding:15px 8px;
    border-radius:13px;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.01em;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:0.3;cursor:default;}
  .btn:disabled:active{transform:none;}
  .btn-learning{
    background:rgba(168,88,60,0.18);
    color:#e2977f;
    border:1px solid rgba(168,88,60,0.35);
  }
  .btn-known{
    background:rgba(91,107,67,0.28);
    color:#b9caa0;
    border:1px solid rgba(91,107,67,0.5);
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:16px;
    font-size:11.5px;
  }
  .link-btn{
    background:none;
    color:var(--paper-dim);
    opacity:0.55;
    padding:6px 4px;
    letter-spacing:0.02em;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .link-btn:active{opacity:0.9;}

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:var(--paper);
    border:1px solid rgba(246,241,231,0.15);
    padding:10px 18px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease, transform 0.25s ease;
    z-index:10;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>Ρήματα <span class="accent">verbs</span></h1>
      <div class="stats" id="statsLabel">— / —</div>
    </div>
  </header>

  <svg class="meander" viewBox="0 0 400 14" preserveAspectRatio="none">
    <path d="M0,2 H14 V12 H26 V2 H40 V12 H52 V2 H66 V12 H78 V2 H92 V12 H104 V2 H118 V12 H130 V2 H144 V12 H156 V2 H170 V12 H182 V2 H196 V12 H208 V2 H222 V12 H234 V2 H248 V12 H260 V2 H274 V12 H286 V2 H300 V12 H312 V2 H326 V12 H338 V2 H352 V12 H364 V2 H378 V12 H390 V2 H400"
      fill="none" stroke="#c9973d" stroke-width="2"/>
  </svg>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-labels">
    <span id="masteredLabel">0 mastered</span>
    <span id="learningLabel">0 still learning</span>
  </div>

  <div class="card-zone">
    <div class="scene">
      <div class="card" id="card">
        <div class="face front">
          <div class="eyebrow" id="frontEyebrow">verb</div>
          <div class="english" id="englishText">—</div>
          <div class="tap-hint">tap to reveal</div>
        </div>
        <div class="face back">
          <div class="greek-primary-row">
            <div class="greek-primary" id="greekPrimary">—</div>
            <button class="speak-btn" id="speakBtn" aria-label="Play pronunciation" title="Play pronunciation">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 9 8 9 13 4 13 20 8 15 3 15 3 9"></polygon>
                <path d="M16 8a5 5 0 0 1 0 8"></path>
                <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
              </svg>
            </button>
          </div>
          <div class="conj-table" id="conjTable"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-learning" id="btnLearning" disabled>Still learning</button>
    <button class="btn btn-known" id="btnKnown" disabled>Got it</button>
  </div>

  <div class="footer-row">
    <button class="link-btn" id="shuffleBtn">reshuffle deck</button>
    <button class="link-btn" id="resetBtn">reset progress</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const VERBS = [
  {en:"be", gr:["είμαι","είσαι","είναι","είμαστε","είσαστε / είστε","είναι"]},
  {en:"have", gr:["έχω","έχεις","έχει","έχουμε","έχετε","έχουν"]},
  {en:"do / make", gr:["κάνω","κάνεις","κάνει","κάνουμε","κάνετε","κάνουν"]},
  {en:"become", gr:["γίνομαι","γίνεσαι","γίνεται","γινόμαστε","γίνεστε / γινόσαστε","γίνονται"]},
  {en:"live", gr:["ζω","ζεις","ζει","ζούμε","ζείτε","ζούν(ε)"]},
  {en:"know", gr:["ξέρω","ξέρεις","ξέρει","ξέρουμε","ξέρετε","ξέρουν"]},
  {en:"understand", gr:["καταλαβαίνω","καταλαβαίνεις","καταλαβαίνει","καταλαβαίνουμε","καταλαβαίνετε","καταλαβαίνουν"]},

  {en:"go", gr:["πηγαίνω / πάω","πηγαίνεις / πας","πηγαίνει / πάει","πηγαίνουμε / πάμε","πηγαίνετε / πάτε","πηγαίνουν / πάνε"]},
  {en:"leave", gr:["φεύγω","φεύγεις","φεύγει","φεύγουμε","φεύγετε","φεύγουν(ε)"]},
  {en:"reside / stay", gr:["μένω","μένεις","μένει","μένουμε","μένετε","μένουν(ε)"]},
  {en:"come", gr:["έρχομαι","έρχεσαι","έρχεται","ερχόμαστε","έρχεστε / ερχόσαστε","έρχονται"]},
  {en:"(re)turn / go around", gr:["γυρίζω","γυρίζεις","γυρίζει","γυρίζουμε","γυρίζετε","γυρίζουν(ε)"]},
  {en:"can", gr:["μπορώ","μπορείς","μπορεί","μπορούμε","μπορείτε","μπορούν(ε)"]},
  {en:"pass / go by", gr:["περνώ / περνάω","περνάς","περνά","περνάμε","περνάτε","περνάν(ε)"]},

  {en:"take", gr:["παίρνω","παίρνεις","παίρνει","παίρνουμε","παίρνετε","παίρνουν(ε)"]},
  {en:"give", gr:["δίνω","δίνεις","δίνει","δίνουμε","δίνετε","δίνουν(ε)"]},
  {en:"put", gr:["βάζω","βάζεις","βάζει","βάζουμε","βάζετε","βάζουν(ε)"]},
  {en:"catch / grab / touch", gr:["πιάνω","πιάνεις","πιάνει","πιάνουμε","πιάνετε","πιάνουν(ε)"]},
  {en:"hold", gr:["κρατάω","κρατάς","κρατά(ει)","κρατάμε","κρατάτε","κρατάνε"]},
  {en:"bring", gr:["φέρνω","φέρνεις","φέρνει","φέρνουμε","φέρνετε","φέρνουν"]},
  {en:"need", gr:["χρειάζομαι","χρειάζεσαι","χρειάζεται","χρειαζόμαστε","χρειάζεστε / χρειαζόσαστε","χρειάζονται"]},

  {en:"use", gr:["χρησιμοποιώ","χρησιμοποιείς","χρησιμοποιεί","χρησιμοποιούμε","χρησιμοποιείτε","χρησιμοποιούν(ε)"]},
  {en:"say", gr:["λέω","λες","λέει","λέμε","λέτε","λένε"]},
  {en:"speak", gr:["μιλάω","μιλάς","μιλά(ει)","μιλάμε","μιλάτε","μιλάνε"]},
  {en:"request", gr:["ζητάω","ζητάς","ζητάει","ζητάμε","ζητάτε","ζητάνε"]},
  {en:"want", gr:["θέλω","θέλεις","θέλει","θέλουμε","θέλετε","θέλουν(ε)"]},
  {en:"ask", gr:["ρωτάω","ρωτάς","ρωτάει","ρωτάμε","ρωτάτε","ρωτάνε"]},
  {en:"close", gr:["κλείνω","κλείνεις","κλείνει","κλείνουμε","κλείνετε","κλείνουνε"]},

  {en:"open", gr:["ανοίγω","ανοίγεις","ανοίγει","ανοίγουμε","ανοίγετε","ανοίγουν"]},
  {en:"play", gr:["παίζω","παίζεις","παίζει","παίζουμε","παίζετε","παίζουν"]},
  {en:"laugh", gr:["γελάω","γελάς","γελά(ει)","γελάμε","γελάτε","γελάν(ε)"]},
  {en:"learn", gr:["μαθαίνω","μαθαίνεις","μαθαίνει","μαθαίνουμε","μαθαίνετε","μαθαίνουν(ε)"]},
  {en:"write", gr:["γράφω","γράφεις","γράφει","γράφουμε","γράφετε","γράφουν(ε)"]},
  {en:"read", gr:["διαβάζω","διαβάζεις","διαβάζει","διαβάζουμε","διαβάζετε","διαβάζουν(ε)"]},
  {en:"remember", gr:["θυμάμαι","θυμάσαι","θυμάται","θυμόμαστε","θυμόσαστε / θυμάστε","θυμούνται"]},

  {en:"forget", gr:["ξεχνάω","ξεχνάς","ξεχνάει","ξεχνάμε","ξεχνάτε","ξεχνάνε / ξεχνούν"]},
  {en:"stop", gr:["σταματάω","σταματάς","σταματάει","σταματάμε","σταματάτε","σταματάνε / σταματούν"]},
  {en:"to be hungry", gr:["πεινάω","πεινάς","πεινάει","πεινάμε","πεινάτε","πεινάνε"]},
  {en:"eat", gr:["τρώω","τρως","τρώει","τρώμε","τρώτε","τρώνε"]},
  {en:"to be thirsty", gr:["διψάω","διψάς","διψάει","διψάμε","διψάτε","διψάνε"]},
  {en:"drink", gr:["πίνω","πίνεις","πίνει","πίνουμε","πίνετε","πίνουν(ε)"]},
  {en:"begin", gr:["ξεκινάω","ξεκινάς","ξεκινά(ει)","ξεκινάμε","ξεκινάτε","ξεκινάνε / ξεκινούν"]},

  {en:"hear / listen", gr:["ακούω","ακούς","ακούει","ακούμε","ακούτε","ακούν(ε)"]},
  {en:"think", gr:["σκέφτομαι","σκέφτεσαι","σκέφτεται","σκεφτόμαστε","σκέφτεστε / σκεφτόσαστε","σκέφτονται"]},
  {en:"see / watch", gr:["βλέπω","βλέπεις","βλέπει","βλέπουμε","βλέπετε","βλέπουν(ε)"]},
  {en:"look", gr:["κοιτάζω","κοιτάζεις","κοιτάζει","κοιτάζουμε","κοιτάζετε","κοιτάζουν(ε)"]},
  {en:"sleep", gr:["κοιμάμαι","κοιμάσαι","κοιμάται","κοιμόμαστε","κοιμάστε / κοιμόσαστε","κοιμούνται"]},
  {en:"finish", gr:["τελειώνω","τελειώνεις","τελειώνει","τελειώνουμε","τελειώνετε","τελειώνουν(ε)"]},
  {en:"wake up", gr:["ξυπνάω","ξυπνάς","ξυπνάει","ξυπνάμε","ξυπνάτε","ξυπνάνε"]}
];

const PRONOUNS = ["εγώ","εσύ","αυτός/ή/ό","εμείς","εσείς","αυτοί/ές/ά"];
const STORAGE_KEY = "greek-verb-progress-v1";
const MASTER_BOX = 4;

let progress = {};      // id -> box (0-4)
let queue = [];         // array of verb ids for this session
let qPos = 0;
let currentId = null;
let flipped = false;

const cardEl = document.getElementById('card');
const englishText = document.getElementById('englishText');
const greekPrimary = document.getElementById('greekPrimary');
const conjTable = document.getElementById('conjTable');
const btnLearning = document.getElementById('btnLearning');
const btnKnown = document.getElementById('btnKnown');
const statsLabel = document.getElementById('statsLabel');
const progressFill = document.getElementById('progressFill');
const masteredLabel = document.getElementById('masteredLabel');
const learningLabel = document.getElementById('learningLabel');
const toastEl = document.getElementById('toast');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQueue(){
  let ids = [];
  VERBS.forEach((v,i)=>{
    const box = progress[i] ?? 0;
    const weight = MASTER_BOX + 1 - box; // lower box = seen more often
    for(let k=0;k<weight;k++) ids.push(i);
  });
  queue = shuffle(ids);
  qPos = 0;
}

async function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) progress = JSON.parse(raw);
  }catch(e){
    progress = {};
  }
}

async function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  }catch(e){
    // storage unavailable — progress stays in-memory for this session
  }
}

function updateStats(){
  const total = VERBS.length;
  let mastered = 0, learning = 0;
  VERBS.forEach((v,i)=>{
    const box = progress[i] ?? 0;
    if(box >= MASTER_BOX) mastered++;
    else if(box === 0) learning++;
  });
  statsLabel.textContent = `${mastered} / ${total} mastered`;
  progressFill.style.width = `${Math.round((mastered/total)*100)}%`;
  masteredLabel.textContent = `${mastered} mastered`;
  learningLabel.textContent = `${learning} still learning`;
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toastEl.classList.remove('show'), 1400);
}

function renderCard(){
  if(qPos >= queue.length){
    buildQueue();
    if(queue.length === 0) return;
  }
  currentId = queue[qPos];
  flipped = false;
  cardEl.classList.remove('flipped');
  btnLearning.disabled = true;
  btnKnown.disabled = true;

  const v = VERBS[currentId];
  englishText.textContent = v.en;
  document.getElementById('frontEyebrow').textContent =
    (progress[currentId] ?? 0) >= MASTER_BOX ? 'verb · mastered' : 'verb';

  greekPrimary.textContent = v.gr[0];
  conjTable.innerHTML = '';
  PRONOUNS.forEach((p,idx)=>{
    const pronEl = document.createElement('div');
    pronEl.className = 'pron';
    pronEl.textContent = p;
    const formEl = document.createElement('div');
    formEl.className = 'form' + (idx===0 ? ' primary':'');
    formEl.textContent = v.gr[idx];
    conjTable.appendChild(pronEl);
    conjTable.appendChild(formEl);
  });
}

function flipCard(){
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
  if(flipped){
    btnLearning.disabled = false;
    btnKnown.disabled = false;
  }
}

function advance(known){
  const box = progress[currentId] ?? 0;
  progress[currentId] = known ? Math.min(box+1, MASTER_BOX) : 0;
  saveProgress();
  updateStats();
  if(known && progress[currentId] === MASTER_BOX && box < MASTER_BOX){
    showToast(`"${VERBS[currentId].en}" mastered ✦`);
  }
  qPos++;
  renderCard();
}

let greekVoice = null;
function pickGreekVoice(){
  if(!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  greekVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('el')) || null;
}
if('speechSynthesis' in window){
  pickGreekVoice();
  window.speechSynthesis.onvoiceschanged = pickGreekVoice;
}

function speakCurrent(){
  if(!('speechSynthesis' in window)){
    showToast('Pronunciation not supported on this browser');
    return;
  }
  const text = VERBS[currentId].gr[0].split(' / ')[0]; // just the primary form if there's an alt
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'el-GR';
  if(greekVoice) utter.voice = greekVoice;
  utter.rate = 0.85;
  const btn = document.getElementById('speakBtn');
  utter.onstart = () => btn.classList.add('speaking');
  utter.onend = () => btn.classList.remove('speaking');
  utter.onerror = () => btn.classList.remove('speaking');
  window.speechSynthesis.speak(utter);
}

document.getElementById('speakBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  speakCurrent();
});

cardEl.addEventListener('click', flipCard);
btnLearning.addEventListener('click', (e)=>{ e.stopPropagation(); advance(false); });
btnKnown.addEventListener('click', (e)=>{ e.stopPropagation(); advance(true); });

document.getElementById('shuffleBtn').addEventListener('click', ()=>{
  buildQueue();
  renderCard();
  showToast('Deck reshuffled');
});

document.getElementById('resetBtn').addEventListener('click', async ()=>{
  if(confirm('Reset all progress? This clears every card back to "still learning".')){
    progress = {};
    await saveProgress();
    updateStats();
    buildQueue();
    renderCard();
    showToast('Progress reset');
  }
});

document.addEventListener('keydown', (e)=>{
  if(e.code === 'Space'){ e.preventDefault(); flipCard(); }
  if(e.code === 'ArrowLeft' && flipped) advance(false);
  if(e.code === 'ArrowRight' && flipped) advance(true);
});

(async function init(){
  await loadProgress();
  updateStats();
  buildQueue();
  renderCard();
})();
</script>
</body>
</html>
